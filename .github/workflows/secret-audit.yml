name: Audit public files for secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Scan all fetched Git history
        run: node scripts/audit-secrets.mjs --history
      - name: Compare deployed files and history with configured credentials
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: node scripts/audit-secrets.mjs --history --deployed
        env:
          AUDIT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDIT_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
